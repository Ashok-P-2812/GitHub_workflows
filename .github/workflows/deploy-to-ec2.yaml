
name: Deploy Application to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    env:
      EC2_USER: ec2-user

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Step 3: Deploy application files
      - name: Copy Files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./mycode/ ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/

      # Step 4: Validate Apache configuration
      - name: Validate Apache Configuration
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo httpd -t"

      # Step 5: Restart Apache
      - name: Restart Apache
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart httpd"

      # Step 6: Deployment status
      - name: Deployment Completed
        run: |
          echo "Application deployed successfully to AWS EC2!"
